[package]
name="qasset-binius-verifier-profile-research"
version="0.1.0"
edition="2024"
license="MIT"
publish=false
[workspace]
[dependencies]
qasset-binius-nostd-verifier={path="../binius-verifier-port/guest"}
binius-core={path="../binius-verifier-port/vendor/binius64/crates/core"}
binius-verifier={path="../binius-verifier-port/vendor/binius64/crates/verifier"}
binius-transcript={path="../binius-verifier-port/vendor/binius64/crates/transcript"}
binius-hash={path="../binius-verifier-port/vendor/binius64/crates/hash"}
binius-spartan-frontend={path="../binius-verifier-port/vendor/binius64/crates/spartan-frontend"}
binius-spartan-verifier={path="../binius-verifier-port/vendor/binius64/crates/spartan-verifier"}
binius-iop={path="../binius-verifier-port/vendor/binius64/crates/iop"}
binius-utils={path="../binius-verifier-port/vendor/binius64/crates/utils"}
binius-field={path="../binius-verifier-port/vendor/binius64/crates/field"}
binius-math={path="../binius-verifier-port/vendor/binius64/crates/math"}
smallvec={version="1.15.1",default-features=false}
sha2={version="0.10",default-features=false}
hex={version="0.4",default-features=false,features=["alloc"]}
serde_json="1"
tracing={version="=0.1.44",default-features=false,features=["std"]}
pprof = { version = "0.15.0", features = ["flamegraph", "frame-pointer"] }
[profile.release]
opt-level=3
lto=false
codegen-units=16
debug=true
