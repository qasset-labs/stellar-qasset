[package]
name="qasset-binius-external-input"
version="0.1.0"
edition="2024"
license="MIT"
publish=false
[workspace]
[lib]
crate-type=["cdylib"]
[dependencies]
qasset-binius-nostd-verifier={path="../guest"}
binius-core={path="../vendor/binius64/crates/core"}
binius-verifier={path="../vendor/binius64/crates/verifier"}
binius-transcript={path="../vendor/binius64/crates/transcript"}
binius-hash={path="../vendor/binius64/crates/hash"}
binius-spartan-frontend={path="../vendor/binius64/crates/spartan-frontend"}
binius-spartan-verifier={path="../vendor/binius64/crates/spartan-verifier"}
binius-iop={path="../vendor/binius64/crates/iop"}
binius-utils={path="../vendor/binius64/crates/utils"}
binius-field={path="../vendor/binius64/crates/field",features=["compact-inversion"]}
binius-math={path="../vendor/binius64/crates/math"}
smallvec={version="1.15.1",default-features=false}
sha2={version="0.11.0",default-features=false}
hex={version="0.4",default-features=false,features=["alloc"]}
[profile.release]
opt-level="z"
lto="fat"
codegen-units=1
panic="abort"
strip="symbols"
debug=false
