[package]
name="qasset-ghash-arithmetic-check"
version="0.1.0"
edition="2024"
publish=false
license="MIT"
[workspace]
[lib]
crate-type=["cdylib"]
[dependencies]
binius-field={path="../vendor/binius64/crates/field"}
[features]
default=[]
compact=["binius-field/compact-inversion"]
[profile.release]
opt-level="z"
lto="fat"
codegen-units=1
panic="abort"
strip="symbols"
