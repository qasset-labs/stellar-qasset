name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    env:
      RUSTUP_TOOLCHAIN: "1.94.1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.94.1
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy
          rustup target add wasm32v1-none --toolchain 1.94.1

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Contract tests
        run: cargo test --locked --workspace

      - name: Signer tests
        working-directory: tools/qasset-sac-signer
        run: cargo test --locked

      - name: Release build and reference hashes
        run: |
          # The reference SAC administrator Wasm embeds dependency source paths under
          # /home/mohamed/.cargo, so it reproduces only with that Cargo home (FW-DEV-03).
          sudo mkdir -p /home/mohamed
          sudo chown "$(id -u):$(id -g)" /home/mohamed
          export CARGO_HOME=/home/mohamed/.cargo
          cargo build --locked --workspace --target wasm32v1-none --release
          printf '%s  %s\n' \
            f7ed9b81ca062af1b52c793fa068d43220d900c0d572e648f6e2d0f5a2a472b6 target/wasm32v1-none/release/qasset_sac_admin.wasm \
            26f684edb7e3255ac1617f1455fbfcf886a0f5b189f31974b873a5bc0f98a207 target/wasm32v1-none/release/qasset_registry.wasm \
            | sha256sum --check

      - name: Evidence helper
        working-directory: tools/qasset-evidence-crypto
        run: cargo build --locked --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python dependencies
        run: python -m pip install --require-hashes -r scripts/requirements-poc.lock

      - name: Python tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Offline evidence verification
        run: python scripts/verify_qasset_evidence.py --offline
